name: Check List Main - Android release

on:
  workflow_dispatch:
    inputs:
      note:
        description: "One-time setup: create and safely store the Android signing key"
        required: false
        default: "Initial signing-key setup"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  setup-signing-key:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Create encrypted signing key (one time)
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_STORE_PASSWORD:-}" ]; then
            echo "::error::Add the SIGNING_STORE_PASSWORD repository secret first."
            exit 1
          fi
          if [ -f signing/release-keystore.jks.enc ]; then
            echo "A signing key already exists. It will not be replaced."
            exit 0
          fi
          mkdir -p signing
          keytool -genkeypair -v \
            -keystore signing/release-keystore.jks \
            -storepass "$SIGNING_STORE_PASSWORD" \
            -keypass "$SIGNING_STORE_PASSWORD" \
            -alias checklist \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Check-list-maik, OU=Android, O=Personal, C=DE"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in signing/release-keystore.jks \
            -out signing/release-keystore.jks.enc \
            -pass env:SIGNING_STORE_PASSWORD
          rm signing/release-keystore.jks
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signing/release-keystore.jks.enc
          git commit -m "chore: save encrypted Android signing key"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  build-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --org com.mhasanzare82crypto --project-name checklist_maik .

      - name: Pin compatible Android Gradle plugin
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/settings.gradle.kts")
          if not p.exists():
              p = Path("android/settings.gradle")
          lines = p.read_text().splitlines()
          for i, line in enumerate(lines):
              if "com.android.application" in line:
                  updated, count = re.subn(r'version\s+"[^"]+"', 'version "8.9.1"', line, count=1)
                  if count == 0:
                      raise SystemExit("Could not identify Android plugin version on: " + line)
                  lines[i] = updated
                  break
          else:
              raise SystemExit("Android application plugin declaration was not found")
          p.write_text("\n".join(lines) + "\n")
          p = Path("android/gradle/wrapper/gradle-wrapper.properties")
          lines = p.read_text().splitlines()
          for i, line in enumerate(lines):
              if line.startswith("distributionUrl="):
                  lines[i] = "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-all.zip"
                  break
          else:
              raise SystemExit("Gradle distributionUrl was not found")
          p.write_text("\n".join(lines) + "\n")
          PY

      - name: Set app display name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s, n = re.subn(r'android:label="[^"]*"', 'android:label="Check List Main"', s, count=1)
          if n == 0:
              s = s.replace("<application", '<application android:label="Check List Main"', 1)
          p.write_text(s)
          PY

      - name: Restore signing key
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_STORE_PASSWORD:-}" ]; then
            echo "::error::The SIGNING_STORE_PASSWORD secret is missing."
            exit 1
          fi
          test -f signing/release-keystore.jks.enc || {
            echo "::error::Signing key not found. Run the workflow manually once on the main branch first."
            exit 1
          }
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in signing/release-keystore.jks.enc \
            -out android/app/release-keystore.jks \
            -pass env:SIGNING_STORE_PASSWORD

      - name: Configure Android release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          block = """
              signingConfigs {
                  create("release") {
                      storeFile = file("release-keystore.jks")
                      storePassword = System.getenv("SIGNING_STORE_PASSWORD")
                      keyAlias = "checklist"
                      keyPassword = System.getenv("SIGNING_STORE_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          """
          if 'create("release")' not in s:
              marker = "\n}\n\nflutter {"
              if marker not in s:
                  raise SystemExit("Could not safely configure Android signing in build.gradle.kts")
              s = s.replace(marker, "\n" + block + "\n}\n\nflutter {", 1)
              p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build signed APK and App Bundle
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          flutter build apk --release
          flutter build appbundle --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Check-List-Main.apk
          cp build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/Check-List-Main.aab

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Check-List-Main-${{ github.ref_name }}
          path: |
            build/app/outputs/flutter-apk/Check-List-Main.apk
            build/app/outputs/bundle/release/Check-List-Main.aab
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/Check-List-Main.apk
            build/app/outputs/bundle/release/Check-List-Main.aab
