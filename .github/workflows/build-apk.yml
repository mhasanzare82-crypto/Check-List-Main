name: Build Checklist APK

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "setup-signing برای ساخت کلید اولیه، build برای ساخت APK"
        required: true
        type: choice
        options:
          - setup-signing
          - build
        default: setup-signing

permissions:
  contents: write

jobs:
  setup-signing:
    if: inputs.mode == 'setup-signing'
    runs-on: ubuntu-latest
    steps:
      - name: Require export password
        env:
          EXPORT_PASSWORD: ${{ secrets.KEY_EXPORT_PASSWORD }}
        run: |
          if [ -z "$EXPORT_PASSWORD" ]; then
            echo "::error::ابتدا Secret با نام KEY_EXPORT_PASSWORD را در GitHub تنظیم کنید."
            exit 1
          fi

      - name: Generate a permanent Android release key
        env:
          EXPORT_PASSWORD: ${{ secrets.KEY_EXPORT_PASSWORD }}
        run: |
          set -euo pipefail
          STORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$(openssl rand -hex 24)"
          KEY_ALIAS="checklist-release"
          keytool -genkeypair -v \
            -keystore release-keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Checklist App, OU=Mobile, O=Personal, L=Unknown, ST=Unknown, C=US"
          {
            echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
            echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
          } > signing-credentials.txt
          tar -czf signing-bundle.tar.gz release-keystore.jks signing-credentials.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in signing-bundle.tar.gz \
            -out checklist-signing-bundle.enc \
            -pass env:EXPORT_PASSWORD
          rm -f release-keystore.jks signing-credentials.txt signing-bundle.tar.gz

      - name: Upload encrypted signing bundle
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-checklist-signing-key
          path: checklist-signing-bundle.enc
          if-no-files-found: error
          retention-days: 3

  build:
    if: inputs.mode == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --org com.mhasanzare82crypto --project-name checklist_maik .

      - name: Configure persistent release signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEYSTORE_BASE64" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "::error::چهار Secret امضای پایدار را طبق راهنمای README تنظیم کنید."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              '    buildTypes {',
              '''    signingConfigs {
                  create("release") {
                      storeFile = file("release-keystore.jks")
                      storePassword = System.getenv("SIGNING_STORE_PASSWORD")
                      keyAlias = System.getenv("SIGNING_KEY_ALIAS")
                      keyPassword = System.getenv("SIGNING_KEY_PASSWORD")
                  }
              }

              buildTypes {'''
          )
          s = s.replace(
              '        release {',
              '        release {\n            signingConfig = signingConfigs.getByName("release")'
          )
          s = s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )
          p.write_text(s)
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          m = manifest.read_text()
          m = m.replace('android:label="checklist_maik"', 'android:label="چک‌لیست من"')
          manifest.write_text(m)
          PY

      - name: Install Python image dependencies
        run: python3 -m pip install Pillow

      - name: Generate custom checklist launcher icon
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          im = Image.new("RGBA", (512, 512), (43, 92, 190, 255))
          d = ImageDraw.Draw(im)
          d.rounded_rectangle((90, 55, 422, 457), radius=48, fill=(255,255,255,255))
          for y in (145, 245, 345):
              d.rounded_rectangle((135,y-22,179,y+22), radius=8, outline=(43,92,190,255), width=10)
              d.line((142,y,153,y+12,174,y-14), fill=(28,158,117,255), width=10)
              d.rounded_rectangle((205,y-12,365,y+12), radius=10, fill=(43,92,190,255))
          sizes = {"mipmap-mdpi":48, "mipmap-hdpi":72, "mipmap-xhdpi":96, "mipmap-xxhdpi":144, "mipmap-xxxhdpi":192}
          res = Path("android/app/src/main/res")
          for folder, pixels in sizes.items():
              (res / folder).mkdir(parents=True, exist_ok=True)
              im.resize((pixels,pixels), Image.Resampling.LANCZOS).save(res / folder / "ic_launcher.png")
          adaptive = res / "mipmap-anydpi-v26" / "ic_launcher.xml"
          if adaptive.exists():
              adaptive.unlink()
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: checklist-maik-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
